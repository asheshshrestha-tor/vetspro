{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <title>No branch | {{ site.short_name }}</title>
  {% include "dashboard/partials/head.html" %}
</head>
<body class="app-blank">
  <div class="d-flex flex-column flex-center min-vh-100 p-10 text-center">
    <img src="{% static 'images/bmb.jpg' %}" alt="" class="h-80px rounded-circle mb-8">
    <h1 class="fs-2 fw-bold text-gray-900 mb-3">You are not assigned to a branch</h1>
    <p class="text-gray-600 fs-5 mb-8">Ask an administrator to add a branch to your account under Staff users.</p>
    <form method="post" action="{% url 'dashboard:logout' %}">{% csrf_token %}<button type="submit" class="btn btn-light">Sign out</button></form>
  </div>
</body>
</html>
