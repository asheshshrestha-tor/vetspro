<div class="menu menu-column menu-rounded menu-sub-indention fw-semibold fs-6" id="kt_app_sidebar_menu" data-kt-menu="true" data-kt-menu-expand="false">
  <div class="menu-item">
    <a class="menu-link{% if is_home %} active{% endif %}" href="{% url 'dashboard:home' %}">
      <span class="menu-icon"><i class="ki-outline ki-element-11 fs-2"></i></span>
      <span class="menu-title">Dashboard</span>
    </a>
  </div>

  {% for group in groups %}
    <div class="menu-item pt-5">
      <div class="menu-content">
        <span class="menu-heading fw-bold text-uppercase fs-7">{{ group.title }}</span>
      </div>
    </div>
    {% for item in group.items %}
      <div class="menu-item">
        <a class="menu-link{% if item.active %} active{% endif %}" href="{{ item.url }}"{% if item.active %} aria-current="page"{% endif %}>
          <span class="menu-icon"><i class="ki-outline {{ item.icon }} fs-2"></i></span>
          <span class="menu-title">{{ item.title }}</span>
          {% if item.badge %}
            <span class="menu-badge"><span class="badge badge-danger">{{ item.badge }}</span></span>
          {% endif %}
        </a>
      </div>
    {% endfor %}
  {% endfor %}
</div>
