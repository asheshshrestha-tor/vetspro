<div class="modal fade" id="preview_modal" tabindex="-1" aria-labelledby="preview_modal_title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl modal-fullscreen-lg-down">
    <div class="modal-content">
      <div class="modal-header py-4">
        <h2 class="modal-title fs-4 fw-bold text-truncate" id="preview_modal_title">Preview</h2>
        <div class="d-flex align-items-center gap-2 ms-3">
          <button type="button" class="btn btn-sm btn-primary" data-preview-print><i class="ki-outline ki-printer fs-4"></i> Print</button>
          <a href="#" class="btn btn-sm btn-light" data-preview-download download><i class="ki-outline ki-file-down fs-4"></i> Download</a>
          <a href="#" class="btn btn-sm btn-light" data-preview-open target="_blank" rel="noopener"><i class="ki-outline ki-exit-right-corner fs-4"></i><span class="d-none d-sm-inline"> New tab</span></a>
          <button type="button" class="btn btn-sm btn-icon btn-light" data-bs-dismiss="modal" aria-label="Close"><i class="ki-outline ki-cross fs-2"></i></button>
        </div>
      </div>
      <div class="modal-body p-0 position-relative preview-body">
        <div class="preview-loading" data-preview-loading><span class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading…</span></span></div>
        <iframe class="preview-frame" title="Preview" data-preview-frame></iframe>
      </div>
    </div>
  </div>
</div>
